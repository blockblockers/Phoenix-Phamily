name: Selected league historical archive
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League slug or all'
        required: true
        default: phoenix-phamily
        type: string
      through:
        description: 'Last historical year (blank = season minus one)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build selected archive
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SELECTED_LEAGUE: ${{ inputs.league }}
          THROUGH: ${{ inputs.through }}
        run: |
          args=(--mode archive --league "${SELECTED_LEAGUE:-phoenix-phamily}")
          if [ -n "$THROUGH" ]; then args+=(--through "$THROUGH"); fi
          python run_leagues.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-league-archives
          path: leagues/*/legacy/
          retention-days: 90
